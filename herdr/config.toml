onboarding = false
# https://herdr.dev/docs/configuration/
#
# Herdr works without a config file. Add only non-default settings here.
# Run `herdr --default-config` to see every key with its type and default.

[keys]
# Default is ctrl+b; ctrl+a matches GNU screen's prefix.
prefix = "ctrl+a"
switch_tab = ["ctrl+1..9"]
switch_workspace = ["prefix+1..9"]
focus_agent = ["prefix+ctrl+1..9"]
previous_workspace = ["prefix+up", "shift+up"]
next_workspace = ["prefix+down", "shift+down"]
previous_tab = ["prefix+left", "shift+left"]
next_tab = ["prefix+right", "shift+right"]

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
panel_bg = "transparent" # dark-greeny  — tab background, toast bg
surface_dim = "#293126" # dark-greeny   — selected space and borders
surface0 = "reset" # mid-dark-greeny    — inactive tabs
surface1 = "#3E4939" # greeny           — ?
overlay0 = "#8A9C81" # green grey       — text (spaces, headlines, branches)
overlay1 = "#D7E2CC" # dark-blue        — named tab text, tab plus icon

# Text
text = "#ECEBE3" # off-white            — active space text, toast headline text
subtext0 = "#D7E2CC" # gray             — inactive space text

# Accent
accent = "#FFFF11" # yellow             — active tab bg

# Accent palette
yellow = "#FFFF11" # yellow
peach = "#F09139" # orange              — secondary action
red = "#FF003C" # red                   — error
green = "#80D080" # green               — success (brighter; #55AA55 sat in the same hue as the bg)
blue = "#6BC2FD" # light-blue           — info (dashy's `blue` is too dark for an accent)
teal = "#80D080" # green                — dashy has no distinct cyan
mauve = "#F09139" # light-blue          — secondary accent (branches, labels)

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]
